name: CI

on:
  pull_request:
  push:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@v5
      - name: Validate pattern manifests
        run: uv run python tools/validate_patterns.py
      - name: Check composition rules
        run: uv run python tools/check_composition_rules.py
      - name: Check production-beta flagship chain
        run: uv run python tools/check_production_beta.py
      - name: Check generated docs
        run: |
          uv run python tools/render_index.py --check
          uv run python tools/render_graph.py --check
          uv run python tools/render_completion.py --check
      - name: Run unit tests
        run: uv run python -m unittest discover tests
